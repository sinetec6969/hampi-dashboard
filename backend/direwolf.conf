# stdin-audio RX-only config.
# ADEVICE null output: direwolf otherwise grabs ALSA "default" for TX audio
# and dies if it's busy — TX waits on the BTech APRS-K1 cable anyway.
# AGWPORT defaults to 8000, which collides with FastAPI — keep disabled.
# KISSPORT feeds raw AX.25 frames to ax25.py.
ADEVICE stdin null
ARATE 48000
ACHANNELS 1
AGWPORT 0
KISSPORT 8001
